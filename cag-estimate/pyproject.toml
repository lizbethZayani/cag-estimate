[project]
name = "cag-estimate"
version = "0.1.0"
description = "Context-Augmented Generation for Project Estimation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.35.0",
    "fastapi[standard]>=0.141.1",
    "litellm>=1.50.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "streamlit>=1.28.0",
    "structlog>=24.1.0",
    "uvicorn[standard]>=0.53.0",
    "jinja2>=3.1",
    "instructor>=1.5",
    "redisvl>=0.3",
    "numpy",
]

[project.scripts]
cag-estimate = "cag_estimate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
    "ruff>=0.5",
    "fakeredis>=2.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

