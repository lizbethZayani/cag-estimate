version: '3.9'

services:
  redis:
    image: redis/redis-stack:7.4.0-v0
    container_name: cag-estimate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cag-network
    labels:
      - "com.cag-estimate.service=cache"
      - "com.cag-estimate.description=Exact-match and semantic (RediSearch) cache for LLM responses"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cag-estimate-api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - LLM_STRUCTURED_MAX_TOKENS=${LLM_STRUCTURED_MAX_TOKENS:-8192}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-gpt-4o-mini}
      - SESSION_MAX_TURNS=${SESSION_MAX_TURNS:-6}
      - SESSION_MAX_SESSIONS=${SESSION_MAX_SESSIONS:-1000}
      - ATTACHMENT_MAX_FILES=${ATTACHMENT_MAX_FILES:-5}
      - ATTACHMENT_MAX_BYTES=${ATTACHMENT_MAX_BYTES:-5000000}
      - ATTACHMENT_MAX_CHARS_TOTAL=${ATTACHMENT_MAX_CHARS_TOTAL:-80000}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-86400}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-true}
      - SEMANTIC_CACHE_THRESHOLD=${SEMANTIC_CACHE_THRESHOLD:-0.90}
      - SEMANTIC_CACHE_TTL=${SEMANTIC_CACHE_TTL:-86400}
      - SEMANTIC_CACHE_LOG_ONLY=${SEMANTIC_CACHE_LOG_ONLY:-false}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # For development: mount source code for hot reload
      - ./src:/app/src:ro
      # Mount tests for verification
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - cag-network
    labels:
      - "com.cag-estimate.service=api"
      - "com.cag-estimate.description=CAG Estimate API Service"

  postgres:
    image: postgres:16-alpine
    container_name: estimator-web-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estimator_web_development
    volumes:
      - estimator-web-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estimator_web_development"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - cag-network

  estimator-web:
    build:
      context: ../estimator-web
    container_name: estimator-web
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      RAILS_ENV: development
      ESTIMATOR_API_BASE_URL: http://api:8000
      # LLM calls over long transcriptions can take 1-2 min.
      ESTIMATOR_AI_TIMEOUT: "180"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../estimator-web:/rails
      # Named volume so the bind mount does not shadow installed gems.
      - estimator-web-bundle:/usr/local/bundle
    command: sh -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - cag-network

networks:
  cag-network:
    driver: bridge
    name: cag-estimate-network

volumes:
  redis-data:
    name: cag-estimate-redis-data
  estimator-web-pg-data:
    name: estimator-web-pg-data
  estimator-web-bundle:
    name: estimator-web-bundle
