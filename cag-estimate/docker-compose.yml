version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cag-estimate-api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # For development: mount source code for hot reload
      - ./src:/app/src:ro
      # Mount tests for verification
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - cag-network
    labels:
      - "com.cag-estimate.service=api"
      - "com.cag-estimate.description=CAG Estimate API Service"

networks:
  cag-network:
    driver: bridge
    name: cag-estimate-network
